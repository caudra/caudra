name: Bug report
description: Something in Caudra does not work as documented.
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please search [open and closed issues](https://github.com/caudra/caudra/issues?q=is%3Aissue) first, and report security problems privately as [SECURITY.md](https://github.com/caudra/caudra/blob/main/SECURITY.md) describes.
        For sign-in failures, API errors, or a model that cannot use Caudra's tools, the **Provider or model problem** form asks the right questions.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I searched existing issues and found none for this problem.
          required: true
        - label: The problem happens with the latest release. `caudra update` installs it.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include error messages and screenshots where they help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Run `caudra` in a Git repository.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Caudra version
      description: The output of `caudra --version`.
      placeholder: caudra 0.2.0-preview.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - install.sh
        - install.ps1
        - Nix
        - make install from a checkout
        - cargo install
        - Other
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal emulator, any multiplexer such as tmux or Herdr, and whether you connect over SSH.
      placeholder: Ghostty 1.2 inside tmux 3.5, over SSH
  - type: input
    id: model
    attributes:
      label: Provider and model
      description: The model in use when the problem happened, as `provider/model_id`.
      placeholder: anthropic/claude-sonnet-4-6
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The output of `caudra logs -n 100 -l warn`. Logs leave out prompt text, model output, and tool input. Provider error messages are kept in full, so read the log and remove anything secret before you paste it.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Config snippets, screenshots, recordings, or other details that help.
