# To release:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  WORKCELL_REQUIRE_CODE_WORKER: "1"
  CAUDRA_ENABLE_UPDATE_CHECK: "0"
  BINARY_NAME: caudra

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    if: github.repository == 'caudra/caudra' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.runners.outputs.profile }}
      runners: ${{ steps.runners.outputs.runners }}
      attribution-layout: ${{ steps.source.outputs.attribution-layout }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-ci-runners.py
      - name: Resolve runner profile
        id: runners
        run: python3 scripts/ci-runners.py >> "$GITHUB_OUTPUT"
        env:
          CAUDRA_RUNNER_PROFILE: ${{ vars.CAUDRA_RUNNER_PROFILE || 'github' }}
      - run: python3 scripts/release.py validate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CAUDRA_EXPANDED_ATTRIBUTION: ${{ vars.CAUDRA_EXPANDED_ATTRIBUTION }}

  verify-rust:
    needs: validate
    uses: ./.github/workflows/rust.yml
    with:
      source-sha: ${{ github.sha }}
      runner-profile: ${{ needs.validate.outputs.profile }}

  verify-nix:
    needs: validate
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/nix.yml
    with:
      source-sha: ${{ github.sha }}
      runner-profile: ${{ needs.validate.outputs.profile }}

  verify-python:
    name: Verify release Python
    needs: validate
    runs-on: ubuntu-24.04
    env:
      RUFF_VERSION: 0.16.2
      TY_VERSION: 0.0.70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verification tools
        run: .github/scripts/retry.sh pip install "ruff==${RUFF_VERSION}" "ty==${TY_VERSION}"
      - run: ruff format --check scripts/
      - run: make pylint distribution-tests
      - run: python3 scripts/test-update-website-docs.py
      - run: python3 scripts/test-time-command.py

  create-release:
    name: Prepare guarded draft
    needs: [validate, verify-rust, verify-nix, verify-python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create draft release
        run: python3 scripts/release.py prepare --layout "$ATTRIBUTION_LAYOUT"
        env:
          GH_TOKEN: ${{ github.token }}
          ATTRIBUTION_LAYOUT: ${{ needs.validate.outputs.attribution-layout }}

  build-linux:
    name: Build (${{ matrix.target }})
    needs: [validate, create-release]
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.runner] }}
    env:
      ATTRIBUTION_LAYOUT: ${{ needs.validate.outputs.attribution-layout }}
      CAUDRA_RUNNER_PROFILE: ${{ needs.validate.outputs.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: linux_x64_heavy
          - target: aarch64-unknown-linux-musl
            runner: linux_arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare Alpine cache directories
        run: mkdir -p target "$RUNNER_TEMP/alpine-cargo"

      - uses: actions/cache/restore@v5
        id: cargo-cache
        with:
          key: alpine-cargo-v1-3.21-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', 'scripts/build-code-worker.py') }}
          restore-keys: |
            alpine-cargo-v1-3.21-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
          path: |
            ${{ runner.temp }}/alpine-cargo/registry/cache
            ${{ runner.temp }}/alpine-cargo/git/db

      - uses: ./.github/actions/musl-worker
        id: worker
        with:
          target: ${{ matrix.target }}

      - name: Build in Alpine container
        env:
          ALPINE_IMAGE: ${{ steps.worker.outputs.image }}
          RUST_TOOLCHAIN: ${{ steps.worker.outputs.toolchain }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/alpine-cargo:/cargo" \
            -v "$GITHUB_WORKSPACE/target/code-worker/source:/cargo/registry/src" \
            -w /workspace \
            -e CARGO_HOME=/cargo \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_NET_RETRY \
            -e WORKCELL_REQUIRE_CODE_WORKER=1 \
            -e CAUDRA_ENABLE_UPDATE_CHECK=0 \
            -e GITHUB_REF_NAME \
            -e ATTRIBUTION_LAYOUT \
            -e CAUDRA_RUNNER_PROFILE \
            -e RUST_TOOLCHAIN \
            "$ALPINE_IMAGE" sh -c '
              set -eu
              apk add --no-cache gcc g++ musl-dev make perl linux-headers curl git ca-certificates pkgconf python3-dev
              git config --global --add safe.directory /workspace
              curl --proto "=https" --tlsv1.2 --retry 5 --retry-delay 2 --retry-all-errors -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
              . "$CARGO_HOME/env"
              python3 scripts/time-command.py application-fetch cargo fetch --locked --manifest-path Cargo.toml
              python3 scripts/time-command.py worker-fetch cargo fetch --locked --manifest-path "$(cat target/code-worker/source-manifest-path)"
              export WORKCELL_BUNDLED_MONTY_WORKER="$PWD/target/code-worker/bin/monty"
              export CARGO_PROFILE_RELEASE_STRIP=none
              python3 scripts/time-command.py application-build cargo build --locked --release --package caudra --target ${{ matrix.target }} --timings
              python3 scripts/time-command.py attribution python3 scripts/build-attribution.py \
                --manifest-path Cargo.toml --package caudra --target ${{ matrix.target }} \
                --worker-manifest-path "$(cat target/code-worker/source-manifest-path)" \
                --worker-package monty-runtime --output-dir licenses --layout "$ATTRIBUTION_LAYOUT"
              test -s licenses/manifest.json
              mkdir -p target/release-symbols
              cp target/${{ matrix.target }}/release/caudra target/release-symbols/caudra
              cp target/code-worker/symbols/bin/monty target/release-symbols/monty
              strip target/${{ matrix.target }}/release/caudra
              test "$(target/${{ matrix.target }}/release/caudra --version)" = "caudra ${GITHUB_REF_NAME#v}"
              python3 scripts/time-command.py smoke-build cargo test --locked --release --target ${{ matrix.target }} \
                -p caudra-workcell --test embedded_worker --no-run --timings
              python3 scripts/time-command.py smoke-execute cargo test --locked --release --target ${{ matrix.target }} \
                -p caudra-workcell --test embedded_worker
              smoke_output="$(OPENAI_API_KEY=release-smoke \
                XDG_CACHE_HOME="$PWD/target/release-smoke-cache" \
                target/${{ matrix.target }}/release/caudra --model openai/gpt-5.1 \
                tools --enabled-only --names 2>&1)"
              printf "%s\n" "$smoke_output" | grep -qx python_execution
              ! printf "%s\n" "$smoke_output" | grep -q "Workcell python_execution is unavailable"
              '

      - name: Restore ownership after Alpine
        if: always()
        run: |
          for directory in target licenses "$RUNNER_TEMP/alpine-cargo"; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          path: |
            ${{ runner.temp }}/alpine-cargo/registry/cache
            ${{ runner.temp }}/alpine-cargo/git/db

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          overwrite: true

      - name: Package diagnostic binaries
        run: |
          archive="${BINARY_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}-symbols.tar.gz"
          test -s licenses/manifest.json
          python3 scripts/time-command.py package-symbols tar czf "$archive" licenses -C target/release-symbols .
          echo "SYMBOL_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}"
          test -s licenses/manifest.json
          python3 scripts/time-command.py package tar czf "${archive}" "${BINARY_NAME}" licenses
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SYMBOL_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build-other:
    name: Build (${{ matrix.target }})
    needs: [validate, create-release]
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.runner] }}
    env:
      ATTRIBUTION_LAYOUT: ${{ needs.validate.outputs.attribution-layout }}
      CAUDRA_RUNNER_PROFILE: ${{ needs.validate.outputs.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos_x64
          - target: aarch64-apple-darwin
            runner: macos_arm64
          - target: x86_64-pc-windows-msvc
            runner: windows_x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}

      - name: Provision macOS installer shells
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            brew install fish
          fi
          for shell in sh bash zsh fish; do
            command -v "$shell"
          done

      - name: Test native platform installer without skipped coverage
        shell: bash
        run: |
          suite=InstallTests
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python3 -c 'import shutil, sys; sys.exit(0 if shutil.which("pwsh") else "Native PowerShell is required")'
            suite=PowerShellTests
          fi
          python3 scripts/test-install.py "$suite" 2>&1 | tee "$RUNNER_TEMP/installer-tests.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/installer-tests.log"
          ! grep -q 'skipped=' "$RUNNER_TEMP/installer-tests.log"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - uses: ./.github/actions/code-worker
        with:
          timing: "true"

      - name: Build
        shell: bash
        run: |
          python3 scripts/time-command.py application-fetch cargo fetch --locked --manifest-path Cargo.toml
          python3 scripts/time-command.py worker-validation python3 scripts/build-code-worker.py --target ${{ matrix.target }}
          python3 scripts/time-command.py worker-fetch cargo fetch --locked --manifest-path "$(cat target/code-worker/source-manifest-path)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            worker="$PWD/target/code-worker/bin/monty.exe"
          else
            worker="$PWD/target/code-worker/bin/monty"
          fi
          export WORKCELL_BUNDLED_MONTY_WORKER="$worker"
          export CARGO_PROFILE_RELEASE_STRIP=none
          python3 scripts/time-command.py application-build cargo build --locked --release --package caudra --target ${{ matrix.target }} --timings
          python3 scripts/time-command.py attribution python3 scripts/build-attribution.py \
            --manifest-path Cargo.toml --package caudra --target ${{ matrix.target }} \
            --worker-manifest-path "$(cat target/code-worker/source-manifest-path)" \
            --worker-package monty-runtime --output-dir licenses --layout "$ATTRIBUTION_LAYOUT"
          test -s licenses/manifest.json
          mkdir -p target/release-symbols
          cp "$PWD/target/code-worker/symbols/bin/"* target/release-symbols/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="target/${{ matrix.target }}/release/caudra.exe"
            cp "$binary" target/release-symbols/
            if [[ -f "target/${{ matrix.target }}/release/caudra.pdb" ]]; then
              cp "target/${{ matrix.target }}/release/caudra.pdb" target/release-symbols/
            fi
          else
            binary="target/${{ matrix.target }}/release/caudra"
            cp "$binary" target/release-symbols/
            strip "$binary"
          fi
          test "$("$binary" --version)" = "${BINARY_NAME} ${GITHUB_REF_NAME#v}"
          python3 scripts/time-command.py smoke-build cargo test --locked --release --target ${{ matrix.target }} \
            -p caudra-workcell --test embedded_worker --no-run --timings
          python3 scripts/time-command.py smoke-execute cargo test --locked --release --target ${{ matrix.target }} \
            -p caudra-workcell --test embedded_worker
          smoke_output="$(OPENAI_API_KEY=release-smoke \
            XDG_CACHE_HOME="$PWD/target/release-smoke-cache" \
            "$binary" --model openai/gpt-5.1 tools --enabled-only --names 2>&1)"
          printf '%s\n' "$smoke_output" | grep -qx python_execution
          ! printf '%s\n' "$smoke_output" | grep -q 'Workcell python_execution is unavailable'

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          overwrite: true

      - name: Package diagnostic binaries
        shell: bash
        run: |
          archive="${BINARY_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}-symbols.tar.gz"
          test -s licenses/manifest.json
          python3 scripts/time-command.py package-symbols tar czf "$archive" licenses -C target/release-symbols .
          echo "SYMBOL_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}"
          test -s licenses/manifest.json
          python3 scripts/time-command.py package tar czf "${archive}" "${BINARY_NAME}" licenses
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.zip"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "${BINARY_NAME}.exe"
          test -s licenses/manifest.json
          python3 scripts/time-command.py package 7z a "${archive}" "${BINARY_NAME}.exe" licenses
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SYMBOL_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish Release
    needs: [validate, build-linux, build-other]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Serialize Latest selection across different stable tags, not just retries of one tag.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Stage, verify, and publish complete release
        run: python3 scripts/release.py publish --artifacts artifacts --layout "$ATTRIBUTION_LAYOUT"
        env:
          GH_TOKEN: ${{ github.token }}
          ATTRIBUTION_LAYOUT: ${{ needs.validate.outputs.attribution-layout }}
