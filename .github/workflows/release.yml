# To release:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  BINARY_NAME: caudra
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        run: |
          .github/scripts/retry.sh bash -c \
            'gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes'

  build-linux:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_INCREMENTAL=0 \
            alpine:3.21 sh -c '
              set -eu
              apk add --no-cache gcc g++ musl-dev make perl linux-headers curl git ca-certificates pkgconf python3-dev
              git config --global --add safe.directory /workspace
              curl --proto "=https" --tlsv1.2 --retry 5 --retry-delay 2 --retry-all-errors -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.0 --profile minimal --target ${{ matrix.target }}
              . "$HOME/.cargo/env"
              python3 scripts/build-code-worker.py --target ${{ matrix.target }}
              export WORKCELL_BUNDLED_MONTY_WORKER="$PWD/target/code-worker/bin/monty"
              export CARGO_PROFILE_RELEASE_STRIP=none
              cargo build --locked --release --target ${{ matrix.target }}
              mkdir -p target/release-symbols
              cp target/${{ matrix.target }}/release/caudra target/release-symbols/caudra
              cp target/code-worker/symbols/bin/monty target/release-symbols/monty
              strip target/${{ matrix.target }}/release/caudra
              cargo test --locked --release --target ${{ matrix.target }} \
                --package caudra-workcell production_host_executes_code_with_the_embedded_worker
              smoke_output="$(OPENAI_API_KEY=release-smoke \
                XDG_CACHE_HOME="$PWD/target/release-smoke-cache" \
                target/${{ matrix.target }}/release/caudra --model openai/gpt-5.1 \
                tools --enabled-only --names 2>&1)"
              printf "%s\n" "$smoke_output" | grep -qx python_execution
              ! printf "%s\n" "$smoke_output" | grep -q "Workcell python_execution is unavailable"
              '
          sudo chown -R $(id -u):$(id -g) target/

      - name: Package diagnostic binaries
        run: |
          archive="${BINARY_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}-symbols.tar.gz"
          tar czf "$archive" LICENSE NOTICE.md THIRD_PARTY_LICENSES -C target/release-symbols .
          echo "SYMBOL_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${archive}" "${BINARY_NAME}" LICENSE NOTICE.md THIRD_PARTY_LICENSES
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$SYMBOL_ARCHIVE" --clobber

  build-other:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ github.ref_name }}

      - name: Build
        shell: bash
        run: |
          python3 scripts/build-code-worker.py --target ${{ matrix.target }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            worker="$PWD/target/code-worker/bin/monty.exe"
          else
            worker="$PWD/target/code-worker/bin/monty"
          fi
          export WORKCELL_BUNDLED_MONTY_WORKER="$worker"
          export CARGO_PROFILE_RELEASE_STRIP=none
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir -p target/release-symbols
          cp "$PWD/target/code-worker/symbols/bin/"* target/release-symbols/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="target/${{ matrix.target }}/release/caudra.exe"
            cp "$binary" target/release-symbols/
            if [[ -f "target/${{ matrix.target }}/release/caudra.pdb" ]]; then
              cp "target/${{ matrix.target }}/release/caudra.pdb" target/release-symbols/
            fi
          else
            binary="target/${{ matrix.target }}/release/caudra"
            cp "$binary" target/release-symbols/
            strip "$binary"
          fi
          cargo test --locked --release --target ${{ matrix.target }} \
            --package caudra-workcell production_host_executes_code_with_the_embedded_worker
          smoke_output="$(OPENAI_API_KEY=release-smoke \
            XDG_CACHE_HOME="$PWD/target/release-smoke-cache" \
            "$binary" --model openai/gpt-5.1 tools --enabled-only --names 2>&1)"
          printf '%s\n' "$smoke_output" | grep -qx python_execution
          ! printf '%s\n' "$smoke_output" | grep -q 'Workcell python_execution is unavailable'

      - name: Package diagnostic binaries
        shell: bash
        run: |
          archive="${BINARY_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}-symbols.tar.gz"
          tar czf "$archive" LICENSE NOTICE.md THIRD_PARTY_LICENSES -C target/release-symbols .
          echo "SYMBOL_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${archive}" "${BINARY_NAME}" LICENSE NOTICE.md THIRD_PARTY_LICENSES
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          archive="${BINARY_NAME}-${tag}-${{ matrix.target }}.zip"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "${BINARY_NAME}.exe"
          7z a "${archive}" "${BINARY_NAME}.exe" LICENSE NOTICE.md THIRD_PARTY_LICENSES
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Upload artifact
        shell: bash
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$SYMBOL_ARCHIVE" --clobber

  publish:
    name: Publish Release
    needs: [build-linux, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        run: .github/scripts/retry.sh gh release download "$GITHUB_REF_NAME" --dir artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../sha256sums.txt
          cat ../sha256sums.txt

      - name: Upload checksums
        run: .github/scripts/retry.sh gh release upload "$GITHUB_REF_NAME" sha256sums.txt --clobber

      - name: Mark release as published
        run: .github/scripts/retry.sh gh release edit "$GITHUB_REF_NAME" --draft=false
