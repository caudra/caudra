name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - "site/**"
              - "install.sh"
              - "install.ps1"
              - "caudra-docgen/**"
              - "caudra-docs/**"
              - "justfile"
              - ".github/workflows/site.yml"

  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_UMAMI_SCRIPT_URL: ""
      VITE_UMAMI_WEBSITE_ID: ""
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: site/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run test:output
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Verify incomplete analytics configuration stays disabled
        run: |
          for setting in url-only id-only; do
            export VITE_UMAMI_SCRIPT_URL=""
            export VITE_UMAMI_WEBSITE_ID=""
            if [ "$setting" = url-only ]; then
              export VITE_UMAMI_SCRIPT_URL="https://analytics.example.test/script.js"
            else
              export VITE_UMAMI_WEBSITE_ID="fixture-caudra-site"
            fi
            bun run build
            bun run test:output
          done
      - name: Verify enabled analytics with a mocked tracker
        env:
          VITE_UMAMI_SCRIPT_URL: https://analytics.example.test/script.js
          VITE_UMAMI_WEBSITE_ID: fixture-caudra-site
        run: |
          bun run build
          bun run test:output
          bun run test:browser
      - name: Build and verify production artifact
        env:
          VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: |
          bun run build
          bun run test:output
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site/dist
          if-no-files-found: error
