name: Python

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "Makefile"
      - "scripts/attribution-policy.json"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/website-docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/nix.yml"
      - "install.sh"
      - "install.ps1"
      - "flake.nix"
      - "workcell/Dockerfile*"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "Makefile"
      - "scripts/attribution-policy.json"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/website-docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/nix.yml"
      - "install.sh"
      - "install.ps1"
      - "flake.nix"
      - "workcell/Dockerfile*"

env:
  RUFF_VERSION: 0.16.2
  TY_VERSION: 0.0.70

jobs:
  distribution:
    name: Distribution tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make distribution-tests

  website-docs:
    name: Website source updater tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-update-website-docs.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/retry.sh pip install "ruff==${RUFF_VERSION}"
      - run: ruff check scripts/
      - run: ruff format --check scripts/

  typecheck:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/retry.sh pip install "ty==${TY_VERSION}"
      - run: ty check scripts/
