name: Python

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "Makefile"
      - "scripts/attribution-policy.json"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/website-docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/nix.yml"
      - ".github/workflows/worker-cache.yml"
      - ".github/actions/code-worker/**"
      - ".github/actions/musl-worker/**"
      - "install.sh"
      - "install.ps1"
      - "flake.nix"
      - "workcell/Dockerfile*"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "Makefile"
      - "scripts/attribution-policy.json"
      - "LICENSE"
      - "NOTICE.md"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/website-docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/nix.yml"
      - ".github/workflows/worker-cache.yml"
      - ".github/actions/code-worker/**"
      - ".github/actions/musl-worker/**"
      - "install.sh"
      - "install.ps1"
      - "flake.nix"
      - "workcell/Dockerfile*"

env:
  RUFF_VERSION: 0.17.2
  TY_VERSION: 0.0.92

jobs:
  distribution:
    name: Distribution tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.15.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make distribution-tests

  website-docs:
    name: Website source updater tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
      - run: python3 scripts/test-update-website-docs.py

  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
      - run: .github/scripts/retry.sh pip install "ruff==${RUFF_VERSION}"
      - run: ruff check scripts/
      - run: ruff format --check scripts/

  typecheck:
    name: ty
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
      - run: .github/scripts/retry.sh pip install "ty==${TY_VERSION}"
      - run: ty check scripts/
