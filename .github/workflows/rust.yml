name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  WORKCELL_REQUIRE_CODE_WORKER: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "build.rs"
              - "install.sh"
              - "install.ps1"
              - "src/**"
              - "caudra-*/**"
              - "workcell/**"
              - "plugins/**"
              - "scripts/build-code-worker.py"
              - "scripts/test-build-code-worker.py"
              - "docs/content/**"
              - "docs/navigation.json"
              - "docs/examples/**"
              - "THIRD_PARTY_LICENSES/**"
              - "Makefile"
              - "scripts/test-make.py"
              - ".github/workflows/rust.yml"

  fmt:
    name: Format (Rust)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  fmt-lua:
    name: Format (Lua)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      STYLUA_VERSION: v2.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        run: |
          .github/scripts/retry.sh curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip stylua
          rm stylua.zip
      - run: ./stylua --check plugins/

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make lint

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python3 scripts/test-build-code-worker.py
      - run: sudo apt-get -o Acquire::Retries=5 install -y ripgrep
      - run: make test
      # Lives here to reuse the warm target dir instead of building the graph twice.
      - run: make gen-docs-check

  machete:
    name: Unused deps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  workcell-native:
    name: Workcell native features
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      WORKCELL_BUNDLED_MONTY_WORKER: ${{ github.workspace }}/target/code-worker/bin/monty
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/build-code-worker.py
      - run: make -C workcell check-native test-optional-features
      - run: cargo test --locked -p workcell-mcp-code --no-default-features --features mcp,bundled-worker --test execution
      - run: cargo test --locked --doc --package 'workcell*'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make build workcell-build

  macos:
    name: Check + Test + Build (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - name: Workcell macOS native filesystem checks
        run: |
          cargo check --locked -p workcell-mcp-files --all-targets --all-features
          cargo check --locked -p workcell --no-default-features --features files-index,snapshots
          cargo test --locked -p workcell-mcp-files --lib staged_files_keep_exact_permission_bits
          cargo test --locked -p workcell-mcp-files --lib metadata_descriptors_refuse_unsupported_platforms
      - run: cargo test --locked -p caudra-agent directory_ancestry_respects_sticky_permissions
        env:
          WORKCELL_BUNDLED_MONTY_WORKER: ${{ github.workspace }}/target/code-worker/bin/monty
      - name: Check sandbox platform guards
        run: |
          cargo clippy --locked -p caudra-sandbox --tests -- -D warnings
          cargo test --locked -p caudra-sandbox local_admin::image
        env:
          WORKCELL_BUNDLED_MONTY_WORKER: ${{ github.workspace }}/target/code-worker/bin/monty
      - run: make build

  windows:
    name: Lint + Build (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install GNU Make and select Git Bash
        shell: pwsh
        run: |
          choco install make --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramFiles\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: make --version && bash --version
      - run: python3 scripts/test-make.py
      - run: make lint build

  ci-pass:
    name: CI
    if: always()
    needs: [fmt, fmt-lua, lint, test, machete, workcell-native, build, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
