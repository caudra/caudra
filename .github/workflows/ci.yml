name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The code tool group runs snippets in a separate `monty` worker process, installed from the
      # pinned release rather than built here. Cached on the pin so it is rebuilt only when it moves.
      - id: worker
        run: echo "version=$(awk '/^name = "monty-pool"$/ { getline; gsub(/[",]/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/code-worker
          key: monty-worker-${{ runner.os }}-${{ steps.worker.outputs.version }}
      - run: make ci
