name: Nix

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAUDRA_ENABLE_UPDATE_CHECK: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ inputs.source-sha != '' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$SOURCE_SHA" = "$GITHUB_SHA"
        env:
          SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
      - uses: dorny/paths-filter@v4
        if: inputs.source-sha == ''
        id: filter
        with:
          filters: |
            code:
              - "flake.*"
              - "**.nix"
              - "Cargo.toml"
              - "Cargo.lock"
              - "**.rs"
              - "**.toml"
              - "**.lua"
              - "plugins/**"
              - "prompts/**"
              - "themes/**"
              - "words/**"
              - "docs/content/**"
              - "docs/navigation.json"
              - "docs/examples/**"
              - "workcell/**"
              - "caudra-automation/skill/**"
              - "caudra-automation/tests/examples/**"
              - "caudra-workflow/builtins/**"
              - "caudra-workflow/skill/**"
              - "decisions/questions/**"
              - ".github/workflows/nix.yml"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*', '**/*.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Check hash drift
        run: nix build --no-update-lock-file .#checks.x86_64-linux.git-dep-hashes
      - name: Check Nix formatting
        run: nix build --no-update-lock-file .#checks.x86_64-linux.fmt
      - name: Check patched dependency sources
        run: nix build --no-update-lock-file .#checks.x86_64-linux.dummy-src
      - name: Check attribution vendor preparation
        run: nix build --no-update-lock-file .#checks.x86_64-linux.vendor-attribution
      - name: Build
        run: nix build --no-update-lock-file -L

  ci-pass:
    name: Nix CI
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code == 'true' && contains(needs.*.result, 'skipped')) ||
          (inputs.source-sha != '' && needs.changes.outputs.code != 'true')
        run: exit 1
