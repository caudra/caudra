name: Compiler cache
description: Route Rust and cc-rs C/C++ compilation through sccache, stored in the GitHub Actions cache
runs:
  using: composite
  steps:
    # Downloads the release, verifies its published SHA-256, and reports hit/miss stats after the job.
    - uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
    # Only main writes. Every other ref, pull requests and release tags alike, can read main's
    # entries but keeps its own invisible to all later refs, so writing there only spends the
    # repository's cache quota and evicts main's. RUSTC_WRAPPER covers direct Cargo, Make, and the
    # worker build, and cc-rs follows it for C and C++.
    - shell: bash
      env:
        RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_GHA_RW_MODE=$RW_MODE"
          echo "SCCACHE_GHA_VERSION=caudra-v1"
        } >> "$GITHUB_ENV"
