[package]
name = "workcell-mcp"
description = "Portable MCP execution server for filesystem, web, and shell tools"
readme = "README.md"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
rmcp.workspace = true
rustix-038.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, default-features = true }
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "signal"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
workcell-tool-contract.workspace = true
workcell-host-contract.workspace = true
workcell-workspace-scm.workspace = true
workcell-workspace-snapshot.workspace = true
workcell-environment = { workspace = true, features = ["mcp"] }
workcell-mcp-code = { workspace = true, features = ["bundled-worker", "mcp"] }
workcell-mcp-code-graph = { workspace = true, features = ["git", "mcp"] }
workcell-mcp-files = { workspace = true, features = ["index", "mcp"] }
workcell-mcp-shell = { workspace = true, features = ["mcp"] }
workcell-mcp-web = { workspace = true, features = ["mcp"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
test-case.workspace = true
tokio = { workspace = true, features = ["test-util"] }
workcell-mcp-code = { workspace = true, features = ["mcp"] }

[lints]
workspace = true
