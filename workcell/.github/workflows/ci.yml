name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The code tool group runs snippets in a separate `monty` worker process, installed from the
      # pinned release rather than built here. Cached on the pin, the build helper, and the toolchain
      # so it is rebuilt only when one moves; the helper still checks a restored worker's stamp.
      - id: worker
        run: echo "version=$(awk '/^name = "monty-pool"$/ { getline; gsub(/[",]/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: target/code-worker
          key: monty-worker-${{ runner.os }}-${{ steps.worker.outputs.version }}-${{ hashFiles('scripts/build-code-worker.py', 'rust-toolchain.toml') }}
      - run: make ci

  macos-files:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p workcell-mcp-files --all-targets --all-features
      - run: cargo check --locked -p workcell --no-default-features --features files-index,snapshots
      - run: cargo test --locked -p workcell-mcp-files --lib staged_files_keep_exact_permission_bits
      - run: cargo test --locked -p workcell-mcp-files --lib metadata_descriptors_refuse_unsupported_platforms
