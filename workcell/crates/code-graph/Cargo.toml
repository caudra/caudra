[package]
name = "workcell-code-graph"
description = "Symbol extraction, reference resolution, and ranking over a source tree"
readme = "README.md"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
default = []
# Repository history signals. Optional because the graph is complete without them: a caller with no
# repository, or one that does not want to pay for a history walk, gets the same symbol graph.
git = ["dep:gix"]

[dependencies]
gix = { workspace = true, optional = true }
lru.workspace = true
sha2 = { workspace = true, default-features = true }
tree-sitter.workspace = true
workcell-source-languages.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
test-case.workspace = true

[lints]
workspace = true
