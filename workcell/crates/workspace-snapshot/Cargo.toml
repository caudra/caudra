[package]
name = "workcell-workspace-snapshot"
description = "Protocol-neutral per-call workspace change records and journaled revert for Workcell hosts"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rustix-038.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, default-features = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
workcell-host-contract.workspace = true
workcell-mcp-files.workspace = true
workcell-snapshot-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-case.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
