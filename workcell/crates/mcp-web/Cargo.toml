[package]
name = "workcell-mcp-web"
description = "Typed web search and fetch tools for Workcell"
readme = "README.md"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
mcp = ["dep:rmcp"]

[dependencies]
async-trait.workspace = true
base64-022.workspace = true
bytes.workspace = true
chrono.workspace = true
dom_query.workspace = true
dom_smoothie.workspace = true
encoding_rs.workspace = true
futures-util.workspace = true
htmd.workspace = true
http.workspace = true
workcell-net.workspace = true
workcell-source-icons.workspace = true
pdf_oxide.workspace = true
regex = { workspace = true, default-features = true }
reqwest.workspace = true
rmcp = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true
url = { workspace = true, features = ["serde"] }
workcell-tool-contract.workspace = true

[dev-dependencies]
test-case.workspace = true

[lints]
workspace = true
