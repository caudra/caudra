[filters.wget]
description = "Drop wget connection preamble and dot progress, keeping the transfer result"
match_command = "^wget\\b"
filter_stderr = true
strip_lines_matching = [
  # ASCII digit classes, not `\d`: `\d` is Unicode-aware, and repeating it this
  # many times compiles past the corpus program-size bound.
  "^--[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}--  ",
  # The resolve and connect lines each have a success and a failure form on the
  # same prefix. Only the success form is matched, so a DNS or connection error
  # is never mistaken for preamble.
  "^Resolving .*\\.\\.\\. [0-9a-f:., ]+$",
  "^Connecting to .*\\.\\.\\. connected\\.$",
  "^HTTP request sent, awaiting response\\.\\.\\. ",
  "^Length: ",
  "^Saving to: ",
  # One dot-progress line per 50K transferred, so this grows without bound with
  # the size of the download. The final line restates the byte count.
  "^\\s*\\d+K[ .]+\\s*\\d+%",
  "^\\s*$",
]
on_empty = "wget: ok"

[[tests.wget]]
name = "preamble and dot progress reduce to the transfer result"
input = """
--2026-09-01 12:33:39--  https://registry.npmjs.org/express
Resolving registry.npmjs.org (registry.npmjs.org)... 104.16.1.34, 104.16.2.34, 104.16.11.34, ...
Connecting to registry.npmjs.org (registry.npmjs.org)|104.16.1.34|:443... connected.
HTTP request sent, awaiting response... 200 OK
Length: 804975 (786K) [application/json]
Saving to: '/tmp/exp.json'

     0K .......... .......... .......... .......... ..........  6% 24.2M 0s
    50K .......... .......... .......... .......... .......... 12% 6.54M 0s
   750K .......... .......... .......... ......               100% 31.2M=0.04s

2026-09-01 12:33:39 (17.3 MB/s) - '/tmp/exp.json' saved [804975/804975]
"""
expected = """
2026-09-01 12:33:39 (17.3 MB/s) - '/tmp/exp.json' saved [804975/804975]
"""

[[tests.wget]]
name = "an http error survives"
input = """
--2026-09-01 12:34:21--  https://registry.npmjs.org/this-does-not-exist-xyz-abc
Resolving registry.npmjs.org (registry.npmjs.org)... 104.16.0.34, 104.16.8.34, 104.16.2.34, ...
Connecting to registry.npmjs.org (registry.npmjs.org)|104.16.0.34|:443... connected.
HTTP request sent, awaiting response... 404 Not Found
2026-09-01 12:34:21 ERROR 404: Not Found.
"""
expected = """
2026-09-01 12:34:21 ERROR 404: Not Found.
"""

[[tests.wget]]
name = "a resolve failure survives despite sharing the Resolving prefix"
input = """
--2026-09-01 12:34:21--  http://nonexistent.invalid.example/
Resolving nonexistent.invalid.example (nonexistent.invalid.example)... failed: Name or service not known.
wget: unable to resolve host address 'nonexistent.invalid.example'
"""
expected = """
Resolving nonexistent.invalid.example (nonexistent.invalid.example)... failed: Name or service not known.
wget: unable to resolve host address 'nonexistent.invalid.example'
"""

[[tests.wget]]
name = "a connect failure survives despite sharing the Connecting prefix"
input = """
--2026-09-01 12:34:22--  http://127.0.0.1:9/
Connecting to 127.0.0.1:9... failed: Connection refused.
"""
expected = """
Connecting to 127.0.0.1:9... failed: Connection refused.
"""

[[tests.wget]]
name = "content written to stdout is retained"
input = """
{"name":"left-pad","version":"1.3.0"}
--2026-09-01 12:34:22--  https://registry.npmjs.org/left-pad
Connecting to registry.npmjs.org (registry.npmjs.org)|104.16.0.34|:443... connected.
Saving to: 'STDOUT'
     0K .......... .......... .                                100% 16.3M=0.001s
2026-09-01 12:34:22 (16.3 MB/s) - written to stdout [22573/22573]
"""
expected = """
{"name":"left-pad","version":"1.3.0"}
2026-09-01 12:34:22 (16.3 MB/s) - written to stdout [22573/22573]
"""
