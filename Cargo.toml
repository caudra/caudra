[package]
name = "workcell-mcp"
description = "Portable MCP execution server for filesystem, web, and shell tools"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[workspace]
members = [
  ".",
  "crates/mcp-files",
  "crates/mcp-shell",
  "crates/mcp-web",
  "crates/net",
  "crates/source-icons",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tensorninja/workcell-mcp"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.51", features = ["derive"] }
dunce = "1.0.5"
dotenvy = "0.15.7"
file-format = { version = "0.29.0", default-features = false }
futures-util = "0.3.32"
http = "1.4.2"
image = { version = "0.25.10", default-features = false }
lru = "0.18.1"
proptest = "1.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk.git", rev = "9334c97f0d6e177546fc33593148aa3f942cb1f8", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rustix = { version = "0.38.44", features = ["fs", "process"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
workcell-mcp-files = { path = "crates/mcp-files" }
workcell-mcp-shell = { path = "crates/mcp-shell" }
workcell-mcp-web = { path = "crates/mcp-web" }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
