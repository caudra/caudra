[package]
name = "caudra"
version.workspace = true
edition = "2024"
authors = [
  "Thorsten Born <tensorninja@caudra.ai>",
]
description = "Terminal coding agent that turns context into effective action."
license = "MIT"
repository = "https://github.com/caudra/caudra"
homepage = "https://caudra.ai"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.98"

[[bin]]
name = "caudra"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
caudra-ui = { workspace = true }
caudra-agent = { workspace = true }
caudra-acp = { workspace = true }
caudra-config = { workspace = true }
caudra-sandbox = { workspace = true }
caudra-providers = { workspace = true }
caudra-storage = { workspace = true }
caudra-lua = { workspace = true }
caudra-otel = { workspace = true }
caudra-workcell = { workspace = true }
caudra-workspace = { workspace = true }
caudra-workflow = { workspace = true }
caudra-docs = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
futures-lite = { workspace = true }
tempfile = { workspace = true }
isahc = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
flume = { workspace = true }
open = { workspace = true }
rpassword = { workspace = true }
jiff = { workspace = true }
include_dir = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }

[workspace]
members = [
  "caudra-acp",
  "caudra-agent",
  "caudra-config",
  "caudra-decision",
  "caudra-sandbox",
  "caudra-diff",
  "caudra-docgen",
  "caudra-docs",
  "caudra-grab",
  "caudra-highlight",
  "caudra-interpreter",
  "caudra-lua",
  "caudra-markdown",
  "caudra-otel",
  "caudra-providers",
  "caudra-storage",
  "caudra-config-macro",
  "caudra-lua-macro",
  "caudra-ui",
  "caudra-workbench",
  "caudra-workcell",
  "caudra-workspace",
  "caudra-workflow",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
  "Thorsten Born <tensorninja@caudra.ai>",
]
license = "MIT"
repository = "https://github.com/caudra/caudra"
rust-version = "1.98"

[workspace.dependencies]
caudra-agent = { path = "caudra-agent" }
caudra-acp = { path = "caudra-acp" }
caudra-config = { path = "caudra-config" }
caudra-decision = { path = "caudra-decision" }
caudra-sandbox = { path = "caudra-sandbox" }
caudra-diff = { path = "caudra-diff" }
caudra-docs = { path = "caudra-docs" }
caudra-interpreter = { path = "caudra-interpreter" }
caudra-providers = { path = "caudra-providers" }
caudra-storage = { path = "caudra-storage" }
caudra-ui = { path = "caudra-ui" }
caudra-lua = { path = "caudra-lua" }
caudra-config-macro = { path = "caudra-config-macro" }
caudra-lua-macro = { path = "caudra-lua-macro" }
caudra-grab = { path = "caudra-grab" }
caudra-highlight = { path = "caudra-highlight" }
caudra-markdown = { path = "caudra-markdown" }
caudra-otel = { path = "caudra-otel" }
caudra-workbench = { path = "caudra-workbench" }
caudra-workcell = { path = "caudra-workcell" }
caudra-workspace = { path = "caudra-workspace" }
caudra-workflow = { path = "caudra-workflow" }
workcell = { git = "https://github.com/tensorninja/workcell-mcp", rev = "b7e86c4cbd030a2a98232439821e28cca41eb934", default-features = false, features = ["files-index", "web", "shell", "code-bundled", "code-graph-git", "environment", "host-contract", "snapshots"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.40", default-features = false, features = ["backup", "bundled", "cache", "limits"] }
bs58 = "0.5"
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52"] }
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
termini = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "registry"] }
clap = { version = "4", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
base64 = "0.23"
url = "2"
getrandom = "0.4"
fastrand = "2"
test-case = "3"
ignore = "0.4"
memchr = "2"
strsim = "0.11"
strum = { version = "0.28", features = ["derive"] }
htmd = "0.5"
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
tiktoken-rs = "0.12"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "nfa-thompson", "hybrid", "unicode-perl", "unicode-word-boundary"] }
gix = { version = "0.87", default-features = false, features = [
    "sha1",
    "status",
    "index",
    "revision",
    "blob-diff",
    "max-performance-safe",
] }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
unicode-segmentation = "1"
similar = { version = "3", features = ["inline", "unicode"] }
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
jsonschema = { version = "0.52", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
keyring = "4"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flume = { version = "0.12", default-features = false, features = ["async", "select"] }
pin-project-lite = "0.2"
rustix = { version = "1", default-features = false, features = ["process"] }
humantime = "2"
toml = "1"
toml_edit = "0.25"
smol = "2"
async-process = "2"
async-lock = "3"
arc-swap = "1"
bitflags = "2"
async-io = "2"
event-listener = "5"
futures-lite = "2"
futures = "0.3"
isahc = { version = "2.0", default-features = false, features = ["text-decoding", "static-curl", "rustls-tls", "http2"] }
flate2 = "1"
zstd = "0.13"
indicatif = "0.18"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }
nucleo = "0.5"
nucleo-matcher = "0.3"
open = "5"
rpassword = "7"
criterion = { version = "0.5", features = ["html_reports"] }
etcetera = "0.11"
dotenvy = "0.15"
tree-sitter = "0.27"
include_dir = "0.7"
mlua = { version = "0.12", features = ["luau", "luau-jit", "async", "send", "serde", "macros"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3.0"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-dart = "0.2.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-containerfile = "0.9.2"
tree-sitter-css = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-json = "0.24"
tree-sitter-make = "1.1"
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty-types" }
get-size2 = "=0.10.1"
notify = { version = "9.0.0-rc.2", default-features = false, features = ["flume", "macos_fsevent"] }
serde_yaml = "0.9"
shell-words = "1"
agent-client-protocol-schema = { version = "1", features = ["unstable_end_turn_token_usage"] }
async-trait = "0.1"
tokio = { version = "1.52.3", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

wait-timeout = "0.2"
inventory = "0.3"
rhai = { version = "1.26", default-features = false, features = ["std", "serde", "internals", "no_time", "no_module"] }

[profile.bench]
debug = true

# Dev rebuilds are linker bound, and debug info is most of what the linker
# chews through. Our crates keep theirs so a debugger still works, the 600
# dependencies do not need any.
[profile.dev.package."*"]
debug = false

# `cc` reads DEBUG from here and passes -g when it is on, which covers the C
# and C++ we build from source: OpenSSL, curl, Luau and 30 tree-sitter
# grammars. Those static archives held the bulk of the bytes.
[profile.dev.build-override]
debug = false

# crossterm 0.29.0 has no VT input on Windows, so bracketed paste never decodes and a
# multiline paste submits at the first newline (#336). Pinned to the head of
# crossterm-rs/crossterm#1030, which lives in refs/pull/1030/head on the upstream repo.
# Remove once the PR ships in a crossterm release.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "3ca54292d2b1f1c58e200a06122ddaf5dd6b5c77" }
