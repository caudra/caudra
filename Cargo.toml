[package]
name = "caudra"
version.workspace = true
edition = "2024"
authors = [
  "Thorsten Born <tensorninja@caudra.ai>",
]
description = "Terminal coding agent that turns context into effective action."
license.workspace = true
repository = "https://github.com/caudra/caudra"
homepage = "https://caudra.ai"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.99"

[[bin]]
name = "caudra"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
caudra-ui = { workspace = true }
caudra-agent = { workspace = true }
caudra-automation = { workspace = true }
caudra-acp = { workspace = true }
caudra-config = { workspace = true }
caudra-sandbox = { workspace = true }
caudra-providers = { workspace = true }
caudra-storage = { workspace = true }
caudra-lua = { workspace = true }
caudra-otel = { workspace = true }
caudra-workcell = { workspace = true }
caudra-workspace = { workspace = true }
caudra-workflow = { workspace = true }
caudra-docs = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
futures-lite = { workspace = true }
tempfile = { workspace = true }
isahc = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
flume = { workspace = true }
open = { workspace = true }
rpassword = { workspace = true }
jiff = { workspace = true }
include_dir = { workspace = true }

[dev-dependencies]
caudra-agent = { workspace = true, features = ["test-support"] }
test-case = { workspace = true }

[workspace]
exclude = ["vendor/crossterm", "workcell/crates/output-filter/evals"]
default-members = ["."]
members = [
  "caudra-acp",
  "caudra-agent",
  "caudra-automation",
  "caudra-config",
  "caudra-decision",
  "caudra-sandbox",
  "caudra-diff",
  "caudra-docgen",
  "caudra-docs",
  "caudra-grab",
  "caudra-highlight",
  "caudra-interpreter",
  "caudra-lua",
  "caudra-markdown",
  "caudra-otel",
  "caudra-providers",
  "caudra-script",
  "caudra-storage",
  "caudra-config-macro",
  "caudra-lua-macro",
  "caudra-ui",
  "caudra-workbench",
  "caudra-workcell",
  "caudra-workspace",
  "caudra-workflow",
  "workcell",
  "workcell/crates/code-graph",
  "workcell/crates/environment",
  "workcell/crates/mcp-code",
  "workcell/crates/mcp-code-graph",
  "workcell/crates/mcp-files",
  "workcell/crates/mcp-shell",
  "workcell/crates/mcp-web",
  "workcell/crates/monty-worker",
  "workcell/crates/net",
  "workcell/crates/output-filter",
  "workcell/crates/snapshot-store",
  "workcell/crates/source-icons",
  "workcell/crates/source-languages",
  "workcell/crates/tool-contract",
  "workcell/crates/workcell",
  "workcell/crates/workcell-host-contract",
  "workcell/crates/workspace-scm",
  "workcell/crates/workspace-snapshot",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
  "Thorsten Born <tensorninja@caudra.ai>",
]
license = "Apache-2.0"
repository = "https://github.com/caudra/caudra"
rust-version = "1.99"

[workspace.dependencies]
caudra-agent = { path = "caudra-agent" }
caudra-acp = { path = "caudra-acp" }
caudra-config = { path = "caudra-config" }
caudra-decision = { path = "caudra-decision" }
caudra-sandbox = { path = "caudra-sandbox" }
caudra-diff = { path = "caudra-diff" }
caudra-docs = { path = "caudra-docs" }
caudra-interpreter = { path = "caudra-interpreter" }
caudra-providers = { path = "caudra-providers" }
caudra-script = { path = "caudra-script", default-features = false }
caudra-automation = { path = "caudra-automation" }
caudra-storage = { path = "caudra-storage" }
caudra-ui = { path = "caudra-ui" }
caudra-lua = { path = "caudra-lua" }
caudra-config-macro = { path = "caudra-config-macro" }
caudra-lua-macro = { path = "caudra-lua-macro" }
