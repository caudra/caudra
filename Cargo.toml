caudra-workspace = { path = "caudra-workspace" }
caudra-workflow = { path = "caudra-workflow" }
workcell = { path = "workcell/crates/workcell", default-features = false }
workcell-code-graph = { path = "workcell/crates/code-graph", default-features = false }
workcell-environment = { path = "workcell/crates/environment", default-features = false }
workcell-host-contract = { path = "workcell/crates/workcell-host-contract" }
workcell-mcp-code = { path = "workcell/crates/mcp-code", default-features = false }
workcell-mcp-code-graph = { path = "workcell/crates/mcp-code-graph", default-features = false }
workcell-mcp-files = { path = "workcell/crates/mcp-files", default-features = false }
workcell-mcp-shell = { path = "workcell/crates/mcp-shell", default-features = false }
workcell-mcp-web = { path = "workcell/crates/mcp-web", default-features = false }
workcell-monty-worker = { path = "workcell/crates/monty-worker" }
workcell-net = { path = "workcell/crates/net" }
workcell-output-filter = { path = "workcell/crates/output-filter" }
workcell-snapshot-store = { path = "workcell/crates/snapshot-store" }
workcell-source-icons = { path = "workcell/crates/source-icons" }
workcell-source-languages = { path = "workcell/crates/source-languages" }
workcell-tool-contract = { path = "workcell/crates/tool-contract" }
