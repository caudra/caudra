[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# `make install-fast`: local release testing trades binary size, cross-crate optimization, and
# incremental-cache disk space for rebuild time. `off` rather than `false`, which still runs
# ThinLTO across a crate's codegen units.
[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[profile.bench]
debug = true
strip = "none"

# Dev rebuilds are linker bound, and debug info is most of what the linker
# chews through. Our crates keep theirs so a debugger still works, the 600
# dependencies do not need any.
[profile.dev.package."*"]
debug = false

# `cc` reads DEBUG from here and passes -g when it is on, which covers the C
# and C++ we build from source: OpenSSL, curl, Luau and 30 tree-sitter
# grammars. Those static archives held the bulk of the bytes.
[profile.dev.build-override]
debug = false

# vendor/crossterm is the head of crossterm-rs/crossterm#1030 (3ca5429), which adds VT input on
# Windows so bracketed paste decodes and a multiline paste no longer submits at the first newline
# (#336). On top sits our colour-scheme patch in src/event.rs and src/event/sys/parse.rs:
# `Event::ColorSchemeChanged`, the mode 2031 and `CSI ?996n` commands, and parsing of
# `CSI ?997;1n` / `CSI ?997;2n`. Unpatched crossterm treats those reports as unfinished and
# swallows every key typed after one until a `u` or `c`. Once a crossterm release ships both,
# delete vendor/crossterm, this patch, the workspace exclude, and the vendor filter in flake.nix.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
