[package]
name = "workcell-mcp"
description = "Portable MCP execution server for filesystem, web, and shell tools"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[workspace]
members = [
  ".",
  "crates/environment",
  "crates/mcp-code",
  "crates/mcp-files",
  "crates/mcp-shell",
  "crates/mcp-web",
  "crates/monty-worker",
  "crates/net",
  "crates/output-filter",
  "crates/source-icons",
  "crates/tool-contract",
  "crates/workcell",
]
# Eval generators are third-party progress libraries built only to capture what
# they emit to a pipe. They are measurement fixtures, not workspace crates, and
# must not join the build, the lockfile, or the dependency audit.
exclude = ["crates/output-filter/evals"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tensorninja/workcell-mcp"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.51", features = ["derive"] }
dunce = "1.0.5"
dotenvy = "0.15.7"
file-format = { version = "0.29.0", default-features = false }
futures-util = "0.3.32"
http = "1.4.2"
image = { version = "0.25.10", default-features = false }
libc = "0.2"
lru = "0.18.1"
# Monty's wire protocol is version-coupled: this host-side pool and the `monty` worker binary must
# come from one release. Keep these pins and MONTY_VERSION in the Makefile in lockstep; `make
# code-worker` fails the build if they diverge. Skew that slips through is still caught at runtime,
# where the pool reports it as a FatalError on the first checkout rather than misbehaving silently.
#
# The worker is installed as its own executable rather than built here on purpose. Monty's
# interpreter and type checker pull a large ruff/ty tree that only resolves correctly under Monty's
# own lockfile, and making it a workspace member would unify `monty-proto/worker` across the
# workspace, linking the interpreter into the server binary for every `--workspace` build.
monty-pool = "=0.0.21"
monty-types = "=0.0.21"
proptest = "1.11.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk.git", rev = "9334c97f0d6e177546fc33593148aa3f942cb1f8", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rustix = { version = "0.38.44", features = ["fs", "process"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.18"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3.0"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
# This is the maintained SQL grammar used by Maki. Its 0.3.x crate pins the build-only
# `cc` dependency to ~1.2.1.
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
wiremock = "0.6.5"
workcell-tool-contract = { path = "crates/tool-contract" }
workcell-environment = { path = "crates/environment", default-features = false }
workcell-mcp-code = { path = "crates/mcp-code", default-features = false }
workcell-mcp-files = { path = "crates/mcp-files", default-features = false }
workcell-mcp-shell = { path = "crates/mcp-shell", default-features = false }
workcell-mcp-web = { path = "crates/mcp-web", default-features = false }
workcell-monty-worker = { path = "crates/monty-worker" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
rmcp.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
workcell-tool-contract.workspace = true
workcell-environment = { workspace = true, features = ["mcp"] }
workcell-mcp-code = { workspace = true, features = ["bundled-worker", "mcp"] }
workcell-mcp-files = { workspace = true, features = ["index", "mcp"] }
workcell-mcp-shell = { workspace = true, features = ["mcp"] }
workcell-mcp-web = { workspace = true, features = ["mcp"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
workcell-mcp-code = { workspace = true, features = ["mcp"] }

[lints]
workspace = true
