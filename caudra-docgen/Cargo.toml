[package]
name = "caudra-docgen"
description = "Documentation generator for Caudra."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "caudra-docgen"

[[bin]]
name = "caudra-docgen"
path = "src/main.rs"

[[bin]]
name = "caudra-model-watch"
path = "src/bin/model_watch.rs"

[dependencies]
caudra-agent = { workspace = true }
caudra-automation = { workspace = true }
caudra-config = { workspace = true }
caudra-docs = { workspace = true }
caudra-lua = { workspace = true }
caudra-providers = { workspace = true }
caudra-ui = { workspace = true }
caudra-workcell = { workspace = true }
color-eyre = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
workspace-hack.workspace = true

[dev-dependencies]
test-case = { workspace = true }
