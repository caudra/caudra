# Every integer `const` whose name holds VERSION or FORMAT, outside tests and
# vendor/, is listed here. `make formats-lint` fails on one that is missing.
#
# Tracked consts version something Caudra persists or exchanges with another
# running Caudra. A patch release must keep each value of its `vX.Y.0` tag
# (`make formats-check`). `name` is the stable key the check compares by, so a
# const can move without counting as a change. `kind` is one of database,
# config, record, journal, or protocol.
#
# Exempt consts carry the reason they cannot break a rollback within a minor.

[[tracked]]
name = "session-database"
path = "caudra-storage/src/sessions/database.rs"
const = "SCHEMA_VERSION"
kind = "database"

[[tracked]]
name = "remote-operation-journal"
path = "caudra-storage/src/remote_operation_journal.rs"
const = "SCHEMA_VERSION"
kind = "journal"

[[tracked]]
name = "history-search-index"
path = "caudra-storage/src/history_search.rs"
const = "INDEX_VERSION"
kind = "database"

[[tracked]]
name = "session-file"
path = "caudra-storage/src/sessions.rs"
const = "SESSION_VERSION"
kind = "record"

# Published model files are persisted in models/v1/models.json with their signature.
# state.json holds optional etag, last_modified and checked_at fields, without a
# separate format integer. v1 is additive-only. Breaking
# changes require format 2 at /v2/, never a format change in a patch release.
[[tracked]]
name = "model-file"
path = "caudra-models/src/lib.rs"
const = "FORMAT"
kind = "record"

