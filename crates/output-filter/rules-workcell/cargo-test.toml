[filters.cargo-test]
description = "Compact cargo test output, dropping empty test-binary sections"
match_command = "^cargo\\s+(test|nextest)\\b"
filter_stderr = true
strip_lines_matching = [
  "^\\s*Updating (crates\\.io index|git repository)",
  "^\\s*Downloading crates",
  "^\\s*Downloaded ",
  "^\\s*Compiling ",
  "^\\s*Fresh ",
  "^\\s*Blocking waiting for file lock",
  "^\\s*Finished ",
  "^\\s*Running ",
  "^\\s*Doc-tests ",
  "^running 0 tests$",
  "^test result: ok\\. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out",
  "^\\s*$",
]
on_empty = "cargo test: ok"

[[tests.cargo-test]]
name = "collapses empty test binaries and keeps real results"
input = """
   Compiling rustdemo v0.1.0 (/work/rustdemo)
    Finished test [unoptimized + debuginfo] target(s) in 0.43s
     Running unittests src/lib.rs (target/debug/deps/rustdemo-60a2a353)

running 2 tests
test tests::adds ... ok
test tests::also_adds ... ok

test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s

     Running unittests src/main.rs (target/debug/deps/rustdemo-ca6d9325)

running 0 tests

test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s

   Doc-tests rustdemo

running 0 tests

test result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
"""
expected = """
running 2 tests
test tests::adds ... ok
test tests::also_adds ... ok
test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
"""

[[tests.cargo-test]]
name = "failures survive"
input = """
running 1 test
test tests::adds ... FAILED

failures:

---- tests::adds stdout ----
assertion `left == right` failed

test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = """
running 1 test
test tests::adds ... FAILED
failures:
---- tests::adds stdout ----
assertion `left == right` failed
test result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out
"""
