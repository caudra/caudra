"""
expected = """
[ERROR] COMPILATION ERROR :
[ERROR] /work/mvndemo/src/main/java/com/example/Broken.java:[1,24] illegal start of expression
[INFO] BUILD FAILURE
[ERROR] Failed to execute goal org.apache.maven.plugins:maven-compiler-plugin:3.1:compile (default-compile) on project mvndemo: Compilation failure
[ERROR] /work/mvndemo/src/main/java/com/example/Broken.java:[1,24] illegal start of expression
"""

[[tests.maven]]
name = "test results and warnings are retained"
input = """
[INFO] --- maven-surefire-plugin:2.12.4:test (default-test) @ mvndemo ---
[WARNING] Corrupted STDOUT by directly writing to native stream in forked JVM
[INFO] Tests run: 4, Failures: 1, Errors: 0, Skipped: 0
