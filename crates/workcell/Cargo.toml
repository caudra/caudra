[package]
name = "workcell"
description = "Protocol-neutral typed Workcell tool facade"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
files = ["dep:workcell-mcp-files"]
files-index = ["files", "workcell-mcp-files/index"]
web = ["dep:workcell-mcp-web"]
shell = ["dep:workcell-mcp-shell", "dep:workcell-output-filter"]
code = ["dep:workcell-mcp-code"]
code-bundled = ["code", "workcell-mcp-code/bundled-worker"]
code-graph = ["dep:workcell-mcp-code-graph"]
code-graph-git = ["code-graph", "workcell-mcp-code-graph/git"]
environment = ["dep:workcell-environment"]
host-contract = ["dep:workcell-host-contract"]
scm = ["files", "dep:workcell-workspace-scm"]
snapshots = ["files", "dep:workcell-workspace-snapshot"]

[dependencies]
workcell-environment = { workspace = true, optional = true }
workcell-host-contract = { workspace = true, optional = true }
workcell-mcp-code = { workspace = true, optional = true }
workcell-mcp-code-graph = { workspace = true, optional = true }
workcell-mcp-files = { workspace = true, optional = true }
workcell-mcp-shell = { workspace = true, optional = true }
workcell-mcp-web = { workspace = true, optional = true }
workcell-output-filter = { path = "../output-filter", optional = true }
workcell-tool-contract.workspace = true
workcell-workspace-scm = { workspace = true, optional = true }
workcell-workspace-snapshot = { workspace = true, optional = true }

[lints]
workspace = true
