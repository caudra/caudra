syntax = "proto3";

package canvas.v1;

import "google/protobuf/timestamp.proto";

option go_package = "example.com/canvas/v1;canvasv1";

// A drawing surface.
message Canvas {
  string id = 1;
  repeated Shape shapes = 2;
  google.protobuf.Timestamp created_at = 3;
  map<string, string> labels = 4;

  message Layer {
    string name = 1;
    Visibility visibility = 2;
  }

  enum Visibility {
    VISIBILITY_UNSPECIFIED = 0;
    VISIBILITY_SHOWN = 1;
  }
}

service CanvasService {
  rpc GetCanvas(GetCanvasRequest) returns (Canvas);
  rpc WatchCanvas(stream GetCanvasRequest) returns (stream Canvas);
}

message GetCanvasRequest {
  string id = 1;
}
