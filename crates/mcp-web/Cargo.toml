[package]
name = "workcell-mcp-web"
description = "Typed web search and fetch tools for Workcell"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["mcp"]
mcp = ["dep:rmcp"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dom_query = { version = "=0.28.0", features = ["markdown", "mini_selector"] }
dom_smoothie = "=0.18.0"
futures-util.workspace = true
htmd = "=0.5.4"
http.workspace = true
workcell-net = { path = "../net" }
workcell-source-icons = { path = "../source-icons" }
pdf_oxide = { version = "0.3.74", default-features = false }
regex = "1.13.1"
reqwest.workspace = true
rmcp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
workcell-tool-contract.workspace = true

[lints]
workspace = true
