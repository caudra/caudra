[package]
name = "caudra-pstack"
description = "The bundled pstack: its skills translated for Caudra as addressable pages, and Rust ports of its scripts."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
caudra-skillpack = { workspace = true }
caudra-script = { workspace = true, features = ["rhai"] }
include_dir = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tla-checker = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
caudra-skillpack = { workspace = true, features = ["checks"] }
caudra-automation = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
